# Загрузка файлов: файлы к заданиям (админ) и файловые ответы учеников (лимит 10 МБ проверяет backend)
client_max_body_size 50m;

# Защита от перебора 8-значного номера варианта (вход гостей и проверка номера)
limit_req_zone $binary_remote_addr zone=guest_auth:10m rate=30r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name rancheasy.ru;
    ssl_certificate /etc/letsencrypt/live/rancheasy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rancheasy.ru/privkey.pem;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/auth/(guest|guest-link)(/|$) {
        limit_req zone=guest_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*) /$1 break;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        rewrite ^/api/(.*) /$1 break;
    }

    # Файлы заданий и ответов (/uploads/...) отдаёт backend, а не SPA-фронтенд
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Домен для пробных вариантов (вход по имени и 8-значному номеру)
